name: Build service

# Ships the on-demand firmware builder to Fly.io.
#
# The image is built here first with the repository root as the build context
# (that is what `apps/build-service/Dockerfile` expects: it copies the workspace
# so `bun install` can link `apps/console` and `packages/build-system`), so a
# broken Dockerfile fails as a build error rather than as a deploy error.
#
# FLY_API_TOKEN is required and the job fails loudly without it: a deployment
# that silently skips is a deployment nobody notices is missing.

on:
  push:
    branches: [rewrite-spa]
    paths:
      - 'apps/build-service/**'
      - 'apps/console/**'
      - 'packages/build-system/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/service.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the Fly API token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set for this repository, so the build service cannot be deployed."
            exit 1
          fi

      - name: Build the image
        run: docker build -f apps/build-service/Dockerfile -t meshcommander-build-service:ci .

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy . --remote-only --config apps/build-service/fly.toml
