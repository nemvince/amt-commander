name: Site

# Publishes the promo site (and the replayed demo inside it) to GitHub Pages.
#
# Everything the site needs is generated by `apps/site/scripts/prepare.ts` --
# the demo console build, the recorded device conversation and the size table --
# so the workflow is one build command and one upload. The measurement cache
# (`apps/console/build/.size-cache.json`) is committed on purpose: without it the
# picker would have no numbers to show, and re-measuring it is 25 real builds.

on:
  push:
    branches: [rewrite-spa]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build the site
        # The build form needs to know where the service is. Set the repository
        # variable BUILD_SERVICE_URL to the deployed instance; without it the
        # site falls back to localhost and the form says so.
        env:
          VITE_BUILD_SERVICE: ${{ vars.BUILD_SERVICE_URL }}
        run: bun run --cwd apps/site build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
