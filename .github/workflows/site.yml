name: Site

# Builds the promo site (and the replayed demo inside it) on every push, and
# publishes it to GitHub Pages once the repository is set up for that.
#
# Everything the site needs is generated by `apps/site/scripts/prepare.ts` --
# the demo console build, the recorded device conversation and the size table --
# so the workflow is one build command and one upload. The measurement cache
# (`apps/console/build/.size-cache.json`) is committed on purpose: without it the
# picker would have no numbers to show, and re-measuring it is 31 real builds for
# each of the four themes.
#
# The screenshots under `apps/site/public/shots/` are committed too. They are not
# rebuilt here -- capturing them needs a browser -- so a push that changes the
# console's chrome should be accompanied by `bun run --cwd apps/site shots` and
# the refreshed PNGs.
#
# Publishing is opt-in through the repository variable `CI_DEPLOY`: Pages is not
# available on a private repository without a paid plan, and `configure-pages`
# fails outright when the site has never been enabled. Set
#   CI_DEPLOY=true            (repo variable)
# once Pages is enabled and the build job's artifact will be deployed; leave it
# unset and the push still verifies that the site builds.

on:
  push:
    branches: [rewrite-spa]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/site build
      - if: vars.CI_DEPLOY == 'true'
        uses: actions/configure-pages@v5
      - if: vars.CI_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    if: vars.CI_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
