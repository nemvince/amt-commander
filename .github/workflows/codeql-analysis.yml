name: "Code scanning - action"

# CodeQL over the TypeScript workspace.
#
# Scanning is opt-in through the repository variable `CI_DEPLOY`, because code
# scanning needs GitHub Advanced Security on a private repository (and GitHub
# has retired the v1 actions this file used to pin, so it could not run at all).
# Set `CI_DEPLOY=true` once the repository is public or GHAS is enabled.
#
# This is a JavaScript/TypeScript project: there is nothing to compile, so the
# analysis runs on the sources directly and the autobuild step the template ships
# with is gone.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 15 * * 4'

jobs:
  CodeQL-Build:
    if: vars.CI_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
